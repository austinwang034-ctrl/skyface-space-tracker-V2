[project]
name = "skyface-space-tracker"
version = "1.4.2"
license = "AGPL-3.0-or-later"
description = "Watch any patch of sky change over time in NASA SPHEREx images."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::erfa.ErfaWarning",
    "ignore:All-NaN slice encountered:RuntimeWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E741"]
